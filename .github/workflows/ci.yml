name: Python CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка синтаксиса
        run: python -m compileall -q calculator.py app.py tests

  test:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Модульные тесты
        run: python -m unittest discover -s tests -v

  package:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Сборка артефакта
        run: |
          mkdir dist
          cp calculator.py README.md dist/
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/manifest.txt
          (cd dist && sha256sum calculator.py README.md > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy_demo:
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: deploy/test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка секрета
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: test -n "$DEMO_TOKEN"
      - name: Проверка и запуск приложения
        working-directory: deploy/test
        run: |
          sha256sum -c SHA256SUMS
          test "$(python calculator.py add 2 3)" = "5.0"
          printf 'Smoke test passed\n' > deployment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.run_id }}
          path: deploy/test/deployment.txt